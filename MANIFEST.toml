name = "Quick Settings Toolbar"
authors = ["iconoclasthero"]
description = "Shows the Options > Quick settings checkboxes as an optional toolbar."
long_description = """
Adds a toolbar with one checkbox per entry of the Quick settings menu.
Toggle it from the View menu. Right-click the toolbar to open the
"Configure quick settings" page. Short labels (aliases) are read from
"quick menu toolbar aliases.txt" in the Picard config folder; the full option
title is the hover tooltip.
"""
